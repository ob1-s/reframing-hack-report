project:
  type: website
  output-dir: _site
  render:
    - index.md

website:
  title: "Reframing Hack"
  description: "A small reward-hacking study of contrastive reframing in LLM outputs."
  site-url: "https://ob1-s.github.io/reframing-hack-report/"
  repo-url: "https://github.com/ob1-s/reframing-hack-report"

format:
  html:
    theme: cosmo
    toc: false
    toc-depth: 3
    number-sections: false
    code-copy: true
    code-overflow: wrap
    anchor-sections: true
    smooth-scroll: true
    css: styles.css
